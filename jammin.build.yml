services:
  - path: services/example-jade
    name: jade
    sdk: jade-0.0.15-pre.1

  - path: services/example-jambrains
    name: jambrains
    sdk: jambrains-1cfc41c

  - path: services/example-jamsdk
    name: jamsdk
    sdk: jam-sdk-0.1.26

  - path: services/example-ajanta
    name: ajanta
    sdk: ajanta-0.1.0
  - path: services/example-jamc3
    name: jamc3
    # Inline SDK config until FluffyLabs/jammin#123 ships in a release.
    # Once available, replace with: sdk: jamc3-<new>
    sdk:
      image: ghcr.io/dreverr/jamc3:2.0.2
      build: main.c3 -o service.jam
      test: "--help"
  - path: services/example-aslan
    name: aslan
    sdk: aslan-0.0.6
